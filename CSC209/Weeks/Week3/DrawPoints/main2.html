<!DOCTYPE html>
<html>
<head>
    <title>Draw Points (3)</title>

    <script>
        var POINTCOLOR = "blue";
        var POINTRADIUS = 10;

        var LABELFONT = "16px Arial";
    </script>
</head>
<body>
    <h1>Draw 3 Points</h1>

    <canvas id="ptsCanvas" width="800" height="600" style="border:1px solid black;"></canvas>

    <script>
        var CANVAS = document.getElementById("ptsCanvas");
        var CTX = CANVAS.getContext("2d");

        // point 1
        CTX.strokeStyle = POINTCOLOR;
        CTX.beginPath();
        CTX.arc(100, 100, POINTRADIUS, 0, 2*Math.PI);
        CTX.stroke();
        CTX.font = LABELFONT;
        CTX.fillText(1, 100-POINTRADIUS/2, 100+POINTRADIUS/2);
        
        // point 2
        CTX.strokeStyle = POINTCOLOR;
        CTX.beginPath();
        CTX.arc(200, 100, POINTRADIUS, 0, 2*Math.PI);
        CTX.stroke();
        CTX.font = LABELFONT;
        CTX.fillText(2, 200-POINTRADIUS/2, 100+POINTRADIUS/2);
        
        // point 3
        CTX.strokeStyle = POINTCOLOR;
        CTX.beginPath();
        CTX.arc(300, 100, POINTRADIUS, 0, 2*Math.PI);
        CTX.stroke();
        CTX.font = LABELFONT;
        CTX.fillText(3, 300-POINTRADIUS/2, 100+POINTRADIUS/2);
    </script>
</body>
</html>
