<!DOCTYPE html>
<html>
<head>
    <title>Draw Points (1)</title>
</head>
<body>
    <h1>Draw 3 Points</h1>

    <canvas id="ptsCanvas" width="800" height="600" style="border:1px solid black;"></canvas>

    <script>
        var CANVAS = document.getElementById("ptsCanvas");
        var CTX = CANVAS.getContext("2d");

        CTX.strokeStyle = "blue";

        // point 1
        CTX.beginPath();
        CTX.arc(100, 100, 10, 0, 2*Math.PI);
        CTX.stroke();
        
        // point 2
        CTX.beginPath();
        CTX.arc(200, 100, 10, 0, 2*Math.PI);
        CTX.stroke();
        
        // point 3
        CTX.beginPath();
        CTX.arc(300, 100, 10, 0, 2*Math.PI);
        CTX.stroke();
    </script>
</body>
</html>
