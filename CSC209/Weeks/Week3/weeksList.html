<!DOCTYPE html>
<html>
<head>
    <title>Weeks List</title>
    <script>
        const NWEEKS = 4
        const DATES = ["Aug 31-Sep 4", "Sep 7-11", "Sep 14-18", "Sep 21-25", "Sep 28-Oct 2"]
        const TOPICS = ["Installation", "HTML", "CSS", "JavaScript"];
        const DESCS = ["Before class starts; install MAMP and VSCode.", "Refresher on HTML.", "CSS layout and styling.", "Introduction to JavaScript."];

        const TITLETEMPLATE = "<h1>Week NUM</h1>";
        const DATESTEMPLATE = "<h2>DATES</h2>";
        const TOPICTEMPLATE = "<p><b>TOPIC</b></p>";
        const DESCTEMPLATE = "<p>DESC</p>";
    </script>
</head>

<body>
    <div id="weeksDiv"></div>

    <script>
        var DIV = document.getElementById("weeksDiv");

        for (let i = 0; i < NWEEKS; i++) {
            const weekTitle = TITLETEMPLATE.replace("NUM", i+1);
            const weekDates = DATESTEMPLATE.replace("DATES", DATES[i]);
            const weekTopic = TOPICTEMPLATE.replace("TOPIC", TOPICS[i]);
            const weekDesc = DESCTEMPLATE.replace("DESC", DESCS[i]);
            const weekBody = weekTitle + weekDates + weekTopic + weekDesc;
            DIV.innerHTML += weekBody;
        }
    </script>
</body>
</html>
